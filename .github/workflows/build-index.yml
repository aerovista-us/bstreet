name: Build homeowner index

on:
  push:
    branches: [main]
    paths:
      - 'AV_1011_N_B_ST_HOMEOWNER_EXIT_POWERHOUSE_MASTER_COMPLETE_2026-09-15.html'
      - 'scripts/build_index.py'
      - 'scripts/enhance_index.py'
      - '.github/workflows/build-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install builder dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Build root site from canonical Powerhouse
        run: |
          python scripts/build_index.py
          python scripts/enhance_index.py
      - name: Smoke-test generated site
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          soup=BeautifulSoup(text,'html.parser')
          pages=soup.find_all('section',class_='page')
          ids=[x.get('data-page') for x in pages]
          assert len(pages)==23, len(pages)
          assert len(ids)==len(set(ids)), ids
          import re
          js=soup.find('script').get_text()
          m=re.search(r'const pages=\[(.*?)\];',js,re.S)
          assert m
          registry_ids=re.findall(r'\["([^"]+)",',m.group(1))
          assert ids==registry_ids,(ids,registry_ids)
          assert soup.find('iframe') is None
          assert soup.find('section',attrs={'data-page':'paidpacket'}) is not None
          assert soup.find(id='siteSearchModal') is not None
          assert 'function printPage' in soup.find('script').get_text()
          assert 'sandbox:/' not in text
          assert not [a.get('href') for a in soup.find_all('a') if (a.get('href') or '').startswith('documents/')]
          robots=soup.find('meta',attrs={'name':'robots'})
          assert robots and 'noindex' in robots.get('content','')
          print(f'QA OK: {len(pages)} sections / {p.stat().st_size} bytes')
          PY
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo 'index.html already current'
            exit 0
          fi
          git config user.name 'AeroVista Build'
          git config user.email 'aerovistaus@gmail.com'
          git add index.html
          git commit -m 'Build MASTER COMPLETE owner dashboard'
          git push
